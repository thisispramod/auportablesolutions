
name: Build and Deploy React Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

      - name: Deploy files to Hostinger
        uses: easingthemes/ssh-deploy@v5.1.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_PORT: ${{ secrets.SFTP_PORT }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          SOURCE: frontend/dist/
          TARGET: domains/auportablesolutions.com/public_html/
          ARGS: "-rlgoDzvc -i"
      - name: Verify live website
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-connrefused \
            https://auportablesolutions.com/ \
            --output /dev/null